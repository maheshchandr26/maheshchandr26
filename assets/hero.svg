<text x="94" y="258" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">SYSTEM STATUS</text>
<circle cx="101" cy="286" r="4" fill="#38BDF8"/>
<text x="114" y="291" fill="#E2E8F0" font-family="monospace" font-size="14">BUILDING  →  ResearchOS</text>
